name: CI

on:
  push:
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install commitlint
        run: npm ci --ignore-scripts

      - name: Test commitlint rules
        run: npm run test:commitlint

      - name: Lint commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            npx --no -- commitlint --last --verbose
          else
            npx --no -- commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run ruff
        run: uv run ruff check .

      - name: Build package
        run: uv build

  npm-wrapper-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use published npm wrapper version for Windows smoke
        shell: pwsh
        run: |
          $packagePath = "npm/magicmd/package.json"
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          $package.version = "0.7.0"
          $package | ConvertTo-Json -Depth 10 | Set-Content $packagePath -Encoding utf8

      - name: Smoke test npm wrapper on Windows
        shell: pwsh
        run: |
          $output = node npm/magicmd/bin/magicmd.js --version
          if ($LASTEXITCODE -ne 0) {
            throw "npm wrapper exited with code $LASTEXITCODE"
          }
          $outputText = ($output | Out-String).Trim()
          Write-Output $outputText
          if ($outputText -ne "MagicMD 0.7.0") {
            throw "Expected 'MagicMD 0.7.0', got '$outputText'"
          }
